# Daily-driver power savings that do not alter the active pointing path.
# On Sharp memory displays, idle blanking stops refresh work while the retained
# image may remain visible until system-off cuts the external power rail.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=100
