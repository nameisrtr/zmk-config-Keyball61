CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=800
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y
CONFIG_PMW3610_SNIPE_CPI=800
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4
CONFIG_PMW3610_SCROLL_TICK=32
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
CONFIG_PMW3610_SMART_ALGORITHM=y

# Adaptive sensor power: retain the current responsive 125 Hz report path
# while moving, then let PMW3610 hardware downshift after a short quiet period.
# Every rest stage samples in 50 ms or less, keeping first-motion detection
# comfortably below 0.1 s without adding a software polling loop.
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=512
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=80000
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=50
# Exact register value: 47 * (128 * 50 ms) = 300.8 seconds.
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=300800
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=50
CONFIG_PMW3610_POLLING_RATE_125_SW=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_PMW3610_MOVEMENT_THRESHOLD=0
